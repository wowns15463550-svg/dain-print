name: 홈페이지 배포

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 블로그 최신 글을 반영하려고 하루 두 번(오전 9시 · 오후 6시) 다시 만듭니다
  schedule:
    - cron: "0 0,9 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: 사진 내려받기 (없는 것만)
        run: npm run assets
      - name: 새로 받은 사진 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets
          git diff --cached --quiet || (git commit -m "사진 원본 저장" && git push)
      - name: 사이트 만들기
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
